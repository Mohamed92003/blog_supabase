name: blog_app
description: "Blog App - Supabase Database Course Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming & Error Handling
  dartz: ^0.10.1

  # UI Components
  cupertino_icons: ^1.0.9
  pinput: ^6.0.2

  # Image Picker
  image_picker: ^1.2.2

  # HTTP
  http: ^1.6.0


  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1

  google_sign_in: ^7.2.0

  # Date Formatting
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env.example
